<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goodnight Stories</title>
<style>
  :root { --bg:#14183a; --card:#1f2550; --text:#eef0ff; --muted:#a9b0e0; --accent:#ffd27a; --err:#ff9a9a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Georgia, "Times New Roman", serif; background: radial-gradient(circle at 20% 0%, #2a3170, var(--bg) 60%); color:var(--text); min-height:100vh; }
  main { max-width: 680px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-weight: normal; margin: 0 0 4px; } h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 24px; }
  form, article { background: var(--card); border-radius: 14px; padding: 20px; }
  label { display:block; font-size: 14px; color: var(--muted); margin: 12px 0 4px; font-family: system-ui, sans-serif; }
  input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid #3a4285; background:#141a40; color:var(--text); font-size:16px; }
  .row { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button { margin-top:18px; width:100%; padding:12px; border:0; border-radius:8px; background:var(--accent); color:#1b1b2e; font-size:16px; font-weight:600; cursor:pointer; font-family: system-ui, sans-serif; }
  button:disabled { opacity:.6; cursor:wait; }
  .error { color: var(--err); font-family: system-ui, sans-serif; margin-top: 12px; }
  article { margin-top: 24px; line-height: 1.7; font-size: 18px; }
  article h2 { font-weight: normal; color: var(--accent); margin-top: 0; }
  .meta { color: var(--muted); font-size: 13px; font-family: system-ui, sans-serif; }
  .status { color: var(--muted); font-size: 14px; font-family: system-ui, sans-serif; margin-top: 10px; display:flex; align-items:center; gap:8px; }
  .moon { width:14px; height:14px; border-radius:50%; box-shadow: 4px -2px 0 0 var(--accent); animation: spin 1.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #timing { margin-top: 24px; background: var(--card); border-radius: 14px; padding: 14px 20px; font-family: system-ui, sans-serif; font-size: 13px; color: var(--muted); }
  #timing summary { cursor: pointer; color: var(--text); }
  #timing table { border-collapse: collapse; width: 100%; margin-top: 10px; }
  #timing td, #timing th { text-align: left; padding: 3px 6px; border-bottom: 1px solid #2c3470; font-weight: normal; }
  #timing td.n, #timing th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #timing .slow { color: var(--err); }
  #timing p { margin: 8px 0 0; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Goodnight <span>Stories</span></h1>
  <p class="sub">A fresh bedtime story, made for your little one.</p>

  <form id="form">
    <label for="name">Child's name</label>
    <input id="name" name="name" required maxlength="40" placeholder="Maya">
    <div class="row">
      <div>
        <label for="age">Age</label>
        <input id="age" name="age" type="number" min="1" max="12" value="5" required>
      </div>
      <div>
        <label for="minutes">Reading time (minutes)</label>
        <input id="minutes" name="minutes" type="number" min="1" max="20" value="5" required>
      </div>
    </div>
    <label for="topic">What should it be about?</label>
    <input id="topic" name="topic" required maxlength="200" placeholder="a sleepy dragon who is afraid of the dark">
    <button id="go" type="submit">Tell me a story</button>
    <div id="status" class="status" hidden><span class="moon"></span><span id="statusText"></span></div>
    <div id="error" class="error" hidden></div>
  </form>

  <article id="story" hidden>
    <h2 id="title"></h2>
    <div id="body"></div>
    <p class="meta" id="meta"></p>
  </article>

  <details id="timing" hidden open>
    <summary>Where the time went</summary>
    <table>
      <thead><tr><th>Step</th><th class="n">Seen by page</th><th class="n">On server</th></tr></thead>
      <tbody id="timingRows"></tbody>
    </table>
    <p id="timingNotes"></p>
  </details>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const form = $('form'), btn = $('go'), errEl = $('error'), storyEl = $('story');

  const STAGES = [
    ['server', 'Request reached the server', 'Connected. Asking Gemini…'],
    ['gemini-request', 'Request sent to Gemini', 'Waiting for Gemini…'],
    ['gemini-response', 'Gemini replied', 'Gemini replied, waiting for the story…'],
    ['thinking', 'Gemini started thinking', 'Gemini is thinking…'],
    ['writing', 'First story words', 'Writing…'],
    ['end', 'Finished', ''],
  ];
  const sec = (ms) => ms == null ? '–' : (ms / 1000).toFixed(1) + 's';

  function setStatus(text) {
    $('status').hidden = !text;
    $('statusText').textContent = text || '';
  }

  // Model output is "# Title\n\nparagraphs..." and may be partial while streaming.
  function render(text) {
    const m = text.match(/^\s*#\s*([^\n]*)\n?([\s\S]*)$/);
    const title = m ? m[1].trim() : '';
    const body = m ? m[2] : text;
    $('title').textContent = title;
    $('title').hidden = !title;
    $('body').replaceChildren(...body.split(/\n\s*\n/).filter(p => p.trim()).map(p => {
      const el = document.createElement('p'); el.textContent = p.trim(); return el;
    }));
    storyEl.hidden = !text.trim();
  }

  // seen: stage -> ms since click (as observed by the page); server: stage -> ms on server.
  function renderTiming(seen, server, trace) {
    const rows = STAGES.filter(([k]) => seen[k] != null || server[k] != null).map(([k, label], i, arr) => {
      const prev = i > 0 ? seen[arr[i - 1][0]] : 0;
      const slow = seen[k] != null && prev != null && seen[k] - prev > 5000;
      const tr = document.createElement('tr');
      if (slow) tr.className = 'slow';
      for (const [v, cls] of [[label, ''], [sec(seen[k]), 'n'], [sec(server[k]), 'n']]) {
        const td = document.createElement('td'); td.textContent = v; if (cls) td.className = cls; tr.append(td);
      }
      return tr;
    });
    $('timingRows').replaceChildren(...rows);

    const notes = [];
    if (trace) {
      notes.push(`Model: ${trace.modelVersion || trace.model}, thinking ${trace.thinkingLevel}.`);
      if (trace.geminiStatus) notes.push(`Gemini HTTP status ${trace.geminiStatus}.`);
      const tok = [['prompt', trace.promptTokens], ['thinking', trace.thoughtsTokens], ['story', trace.outputTokens]]
        .filter(([, n]) => n != null).map(([k, n]) => `${n} ${k}`);
      if (tok.length) notes.push(`Tokens: ${tok.join(', ')}.`);
      notes.push(`${trace.chunks} chunks streamed (${trace.thoughtChunks} thinking).`);
      if (trace.error) notes.push(`Error: ${trace.error}`);
    }
    $('timingNotes').textContent = notes.join(' ');
    $('timing').hidden = false;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form));
    btn.disabled = true;
    errEl.hidden = true;
    storyEl.hidden = true;
    $('timing').hidden = true;
    $('meta').textContent = '';

    const started = performance.now();
    const now = () => Math.round(performance.now() - started);
    const seen = {}, server = {};
    let trace = null;
    let label = 'Sending request…';
    const tick = () => setStatus(`${label} (${Math.round(now() / 1000)}s)`);
    tick(); const timer = setInterval(tick, 1000);

    try {
      const res = await fetch('/api/story', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      if (!res.ok) {
        const json = await res.json().catch(() => ({}));
        throw new Error(json.error || `Request failed (${res.status})`);
      }

      const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
      let buf = '', text = '', done = false, scrolled = false;
      while (true) {
        const { value, done: end } = await reader.read();
        if (end) break;
        buf += value;
        const lines = buf.split('\n'); buf = lines.pop();
        for (const line of lines) {
          if (!line.trim()) continue;
          const msg = JSON.parse(line);
          if (msg.type === 'progress') {
            seen[msg.stage] ??= now();
            server[msg.stage] ??= msg.ms;
            const stage = STAGES.find(([k]) => k === msg.stage);
            if (stage?.[2]) { label = stage[2]; tick(); }
          } else if (msg.type === 'text') {
            text += msg.text; render(text);
            if (!scrolled) { scrolled = true; storyEl.scrollIntoView({ behavior: 'smooth' }); }
          } else if (msg.type === 'done' || msg.type === 'error') {
            trace = msg.timing;
            seen.end = now(); server.end = trace?.doneMs;
            if (msg.type === 'error') throw new Error(msg.error);
            done = true;
            $('meta').textContent = `${msg.wordCount} words (target ${msg.targetWords})`;
          }
        }
      }
      if (!done) throw new Error('The story was cut off. Please try again.');
    } catch (err) {
      seen.end ??= now();
      errEl.textContent = err.message; errEl.hidden = false;
    } finally {
      clearInterval(timer); setStatus('');
      btn.disabled = false;
      renderTiming(seen, server, trace);
    }
  });
</script>
</body>
</html>
